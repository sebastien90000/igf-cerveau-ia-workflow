[project]
name = "igf-cerveau-ia"
version = "0.1.0"
description = "Cerveau IA de l'IGF — pipeline autonome : OneDrive → analyse Mistral → capitalisation Notion"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows",
    "mistralai>=1.5.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
